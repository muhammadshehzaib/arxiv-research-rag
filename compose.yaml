services:
  web:
    build: .
    env_file: .env
    environment:
      FLASHRANK_CACHE_DIR: /root/.cache/flashrank
      QUERY_TIMEOUT_SECONDS: "90"
      GEMINI_TIMEOUT_SECONDS: "45"
      GRAPH_LOAD_CO_AUTHORS: "0"
      RAG_SPARSE_ONLY: "0"
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - model_cache:/root/.cache
    init: true

volumes:
  model_cache:
